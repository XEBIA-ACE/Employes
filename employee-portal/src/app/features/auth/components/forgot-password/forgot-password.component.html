<div class="login-page">
  <div class="login-container">
    <div class="login-brand">
      <mat-icon class="brand-icon">corporate_fare</mat-icon>
      <h1 class="brand-title">Reset Password</h1>
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        <!-- Success state -->
        <div class="success-state" *ngIf="emailSent; else formState">
          <mat-icon class="success-icon">mark_email_read</mat-icon>
          <h3>Check your email</h3>
          <p>We've sent a password reset link to <strong>{{ form.value.email }}</strong>.</p>
          <a mat-flat-button color="primary" routerLink="/auth/login">Back to Login</a>
        </div>

        <!-- Form state -->
        <ng-template #formState>
          <p class="instruction">Enter your email and we'll send you a link to reset your password.</p>

          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email Address</mat-label>
              <input matInput type="email" formControlName="email" placeholder="name@company.com">
              <mat-icon matPrefix>email</mat-icon>
              <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
              <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email address</mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="isLoading">
              <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
              <span *ngIf="!isLoading">Send Reset Link</span>
            </button>

            <div class="back-link">
              <a routerLink="/auth/login">
                <mat-icon>arrow_back</mat-icon> Back to Login
              </a>
            </div>
          </form>
        </ng-template>
      </mat-card-content>
    </mat-card>
  </div>
</div>
