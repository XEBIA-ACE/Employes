<nav class="sidebar" [class.collapsed]="!isOpen" aria-label="Main navigation">
  <!-- Logo area -->
  <div class="sidebar-logo">
    <mat-icon class="logo-icon">corporate_fare</mat-icon>
    <span class="logo-text" *ngIf="isOpen">Employee Portal</span>
  </div>

  <!-- Navigation items -->
  <div class="nav-list">
    <ng-container *ngFor="let item of navItems">
      <ng-container *ngIf="isVisible(item)">

        <!-- Simple route item -->
        <a
          *ngIf="item.route && !item.children"
          [routerLink]="item.route"
          class="nav-item"
          [class.active]="isActive(item)"
          [matTooltip]="!isOpen ? item.label : ''"
          matTooltipPosition="right"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label" *ngIf="isOpen">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge && isOpen">{{ item.badge }}</span>
        </a>

        <!-- Expandable group -->
        <div *ngIf="item.children" class="nav-group">
          <button
            class="nav-item nav-group-header"
            [class.active]="isActive(item)"
            (click)="toggleExpand(item.label)"
            [matTooltip]="!isOpen ? item.label : ''"
            matTooltipPosition="right"
          >
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label" *ngIf="isOpen">{{ item.label }}</span>
            <mat-icon class="expand-icon" *ngIf="isOpen">
              {{ isExpanded(item.label) ? 'expand_less' : 'expand_more' }}
            </mat-icon>
          </button>

          <div class="nav-children" *ngIf="isExpanded(item.label) && isOpen">
            <ng-container *ngFor="let child of item.children">
              <a
                *ngIf="isVisible(child)"
                [routerLink]="child.route"
                class="nav-item nav-child"
                [class.active]="isActive(child)"
              >
                <mat-icon class="nav-icon">{{ child.icon }}</mat-icon>
                <span class="nav-label">{{ child.label }}</span>
              </a>
            </ng-container>
          </div>
        </div>

      </ng-container>
    </ng-container>
  </div>

  <!-- Footer info -->
  <div class="sidebar-footer" *ngIf="isOpen">
    <mat-divider></mat-divider>
    <div class="footer-info">
      <mat-icon>info_outline</mat-icon>
      <span class="version">v{{ '1.0.0' }}</span>
    </div>
  </div>
</nav>
