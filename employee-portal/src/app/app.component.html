<!-- Employee Portal Root Component -->
<div class="app-container" [class.authenticated]="isAuthenticated">

  <!-- Global loading indicator during route transitions -->
  <app-loading-spinner *ngIf="isLoading" [overlay]="true" message="Loading..."></app-loading-spinner>

  <!-- Authenticated layout: sidebar + header + content -->
  <ng-container *ngIf="isAuthenticated; else unauthenticated">
    <app-sidebar></app-sidebar>
    <div class="main-wrapper">
      <app-header></app-header>
      <main class="main-content" role="main">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </div>
  </ng-container>

  <!-- Unauthenticated layout: full-page auth view -->
  <ng-template #unauthenticated>
    <router-outlet></router-outlet>
  </ng-template>

</div>
