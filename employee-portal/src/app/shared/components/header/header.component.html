<mat-toolbar class="portal-header" color="primary">
  <!-- Menu toggle button (mobile) -->
  <button mat-icon-button (click)="onMenuToggle()" aria-label="Toggle navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- App title -->
  <span class="app-title">Employee Portal</span>

  <span class="header-spacer"></span>

  <!-- Notification bell -->
  <button mat-icon-button aria-label="Notifications" matTooltip="Notifications">
    <mat-icon [matBadge]="3" matBadgeColor="accent">notifications</mat-icon>
  </button>

  <!-- User menu -->
  <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-avatar-btn" aria-label="User menu">
    <div class="user-avatar" *ngIf="!currentUser?.avatarUrl; else avatarImg">
      {{ userInitials }}
    </div>
    <ng-template #avatarImg>
      <img [src]="currentUser?.avatarUrl" [alt]="currentUser?.fullName" class="user-avatar-img">
    </ng-template>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <div class="user-menu-header">
      <p class="user-name">{{ currentUser?.fullName }}</p>
      <p class="user-role">{{ currentUser?.position }}</p>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="navigateToProfile()">
      <mat-icon>account_circle</mat-icon>
      My Profile
    </button>
    <button mat-menu-item routerLink="/profile/settings">
      <mat-icon>settings</mat-icon>
      Settings
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      Sign Out
    </button>
  </mat-menu>
</mat-toolbar>
