<div class="login-page">
  <div class="login-container">
    <!-- Logo / Brand -->
    <div class="login-brand">
      <mat-icon class="brand-icon">corporate_fare</mat-icon>
      <h1 class="brand-title">Employee Portal</h1>
      <p class="brand-subtitle">Sign in to manage your HR services</p>
    </div>

    <!-- Login Card -->
    <mat-card class="login-card">
      <mat-card-content>
        <!-- Error Banner -->
        <div class="error-banner" *ngIf="errorMessage" role="alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
          <!-- Email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput
                   type="email"
                   formControlName="email"
                   autocomplete="email"
                   placeholder="name@company.com"
                   [attr.aria-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error>{{ getEmailError() }}</mat-error>
          </mat-form-field>

          <!-- Password -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput
                   [type]="hidePassword ? 'password' : 'text'"
                   formControlName="password"
                   autocomplete="current-password"
                   [attr.aria-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button"
                    (click)="hidePassword = !hidePassword"
                    [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error>{{ getPasswordError() }}</mat-error>
          </mat-form-field>

          <!-- Remember Me + Forgot Password Row -->
          <div class="form-footer-row">
            <mat-checkbox formControlName="rememberMe" color="primary">
              Remember me
            </mat-checkbox>
            <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button mat-flat-button
                  color="primary"
                  type="submit"
                  class="submit-btn"
                  [disabled]="isLoading">
            <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
            <span *ngIf="!isLoading">Sign In</span>
          </button>
        </form>
      </mat-card-content>
    </mat-card>

    <p class="footer-text">
      &copy; {{ 2026 }} Employee Portal. All rights reserved.
    </p>
  </div>
</div>
