<nav class="sidebar" [class.collapsed]="isCollapsed" aria-label="Main navigation">
  <!-- Logo / Brand -->
  <div class="sidebar-header">
    <div class="brand">
      <mat-icon class="brand-icon">corporate_fare</mat-icon>
      <span class="brand-name" *ngIf="!isCollapsed">Employee Portal</span>
    </div>
    <button mat-icon-button (click)="toggleSidebar()" class="collapse-btn"
            [matTooltip]="isCollapsed ? 'Expand' : 'Collapse'"
            matTooltipPosition="right">
      <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <mat-divider></mat-divider>

  <!-- Navigation Items -->
  <mat-nav-list class="nav-list">
    <a mat-list-item
       *ngFor="let item of visibleNavItems"
       [routerLink]="item.route"
       [class.active]="isActive(item.route)"
       [matTooltip]="isCollapsed ? item.label : ''"
       matTooltipPosition="right"
       class="nav-item">
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle *ngIf="!isCollapsed">{{ item.label }}</span>
    </a>
  </mat-nav-list>

  <mat-divider></mat-divider>

  <!-- User quick-info at bottom -->
  <div class="sidebar-footer" *ngIf="currentUser && !isCollapsed">
    <div class="user-info">
      <div class="user-avatar">
        {{ currentUser.firstName.charAt(0) }}{{ currentUser.lastName.charAt(0) }}
      </div>
      <div class="user-details">
        <p class="user-name">{{ currentUser.fullName }}</p>
        <p class="user-dept">{{ currentUser.department }}</p>
      </div>
    </div>
  </div>
</nav>
