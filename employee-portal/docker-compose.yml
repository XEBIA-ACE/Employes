version: "3.9"

# =============================================================================
# Employee Portal — Local Development Stack
# =============================================================================
# Services:
#   frontend  — Angular dev server with hot reload
#   backend   — Mock/real API server (replace with your actual backend)
#   nginx     — Production-like serving (optional, use `--profile prod`)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Angular Dev Server
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: employee-portal-frontend
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules       # preserve node_modules inside container
    environment:
      - NODE_ENV=development
    command: npm start -- --host 0.0.0.0 --poll 1000
    depends_on:
      - backend
    networks:
      - portal-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend API (placeholder — swap with your real service)
  # ---------------------------------------------------------------------------
  backend:
    image: node:20-alpine
    container_name: employee-portal-backend
    working_dir: /api
    ports:
      - "3000:3000"
    volumes:
      - ./mock-api:/api
    command: >
      sh -c "npm install --silent && node server.js"
    environment:
      - PORT=3000
      - NODE_ENV=development
    networks:
      - portal-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Production Nginx (opt-in)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      target: production
    container_name: employee-portal-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portal-net
    profiles:
      - prod
    restart: unless-stopped

networks:
  portal-net:
    driver: bridge
